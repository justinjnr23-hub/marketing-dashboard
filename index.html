<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Marketing Dashboard</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-slate-800">
    <!--my Top navigation -->
  <header class="border-b border-slate-200">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <span class="font-semibold">Marketly</span>
      <nav class="flex gap-6 text-sm text-slate-500">
        <a href="#" class="font-medium text-slate-900">view</a>
        <a href="#" class="hover:text-slate-900">Campaigns</a>
        <a href="#" class="hover:text-slate-900">Reports</a>
        <a href="#" class="hover:text-slate-900">Settings</a>
      </nav>
    </div>
  </header>
   <!--my main section-->
   <section>
   <main class="mx-auto max-w-5xl px-4 py-8">
    <h1 class="text-2xl font-semibold">view</h1>
    <p class="mt-1 text-sm text-slate-500">A quick look at how your marketing is doing.</p>

    <!-- the Stats -->
    <section class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="rounded-lg border border-slate-200 p-4">
        <p class="text-sm text-slate-500">Visitors</p>
        <p class="mt-1 text-3xl font-semibold">12,480</p>
      </div>
      <div class="rounded-lg border border-slate-200 p-4">
        <p class="text-sm text-slate-500">Sign-ups</p>
        <p class="mt-1 text-3xl font-semibold">640</p>
      </div>
      <div class="rounded-lg border border-slate-200 p-4">
        <p class="text-sm text-slate-500">Conversion rate</p>
        <p class="mt-1 text-3xl font-semibold">5.1%</p>
      </div>
    </section>
    <!-- the Campaign list -->
    <section class="mt-8">
      <h2 class="text-lg font-semibold">Campaigns</h2>
      <ul class="mt-3 divide-y divide-slate-200 rounded-lg border border-slate-200">
        <li class="flex items-center justify-between gap-4 p-4">
          <div class="min-w-0">
            <p class="truncate font-medium">Black Friday Sale</p>
            <p class="text-sm text-slate-500">Facebook Ads</p>
          </div>
          <div class="hidden w-40 sm:block">
            <div class="h-2 rounded-full bg-slate-100"><div class="h-2 w-3/4 rounded-full bg-blue-600"></div>
        </div>
        
        <span class="text-sm text-green-600">Active</span>
        </li>
        <li class="flex items-center justify-between gap-4 p-4">
          <div class="min-w-0">
            <p class="truncate font-medium">Weekly Newsletter</p>
            <p class="text-sm text-slate-500">Email</p>
          </div>
          <div class="hidden w-40 sm:block">
            <div class="h-2 rounded-full bg-slate-100"><div class="h-2 w-1/2 rounded-full bg-blue-600"></div></div>





   </section>
  
</body>
</html>
!
